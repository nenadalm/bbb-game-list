name: setup

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: DeLaGuardo/setup-clojure@13
      with:
        cli: '1.12.6.1673'
    - uses: actions/cache@v6
      with:
        path: '~/.m2'
        key: "${{ runner.os }}-maven-${{ hashFiles('*/deps.edn') }}"
        restore-keys: |
          ${{ runner.os }}-maven-
